# RT-DETR-l with Optimized Two-Stage Strategy
ch: 6
nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, IN, []]  # 0
  - [-1, 1, Multiin, [1]]  # 1: 可见光
  - [-2, 1, Multiin, [2]]  # 2: 红外

#----------------- 可见光分支: 保留 1 次 VDIM -----------------------
  - [1, 1, HGStem, [32, 48]] # 3
  - [-1, 1, VisibleVDIM, [48]] # 4
  - [-1, 6, HGBlock, [48, 128, 3]] # 5 stage 1
  - [-1, 1, DWConv, [128, 3, 2, 1, False]] # 6
  - [-1, 6, HGBlock, [96, 512, 3]] # 7 stage 2
  - [-1, 1, DWConv, [512, 3, 2, 1, False]] # 8
  - [-1, 6, HGBlock, [192, 1024, 5, True, False]] # 9
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]]  # 10
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]] # 11 stage 3
  - [-1, 1, DWConv, [1024, 3, 2, 1, False]] # 12
  - [-1, 6, HGBlock, [384, 2048, 5, True, False]] # 13 stage 4

#----------------- 红外分支: 去掉了 TSEM 层 -----------------------
  - [2, 1, HGStem, [32, 48]] # 14
  - [-1, 6, HGBlock, [48, 128, 3]] # 15 stage 1 (原16，向前递补1位)
  - [-1, 1, DWConv, [128, 3, 2, 1, False]] # 16
  - [-1, 6, HGBlock, [96, 512, 3]] # 17 stage 2 (原18)
  - [-1, 1, DWConv, [512, 3, 2, 1, False]] # 18
  - [-1, 6, HGBlock, [192, 1024, 5, True, False]] # 19
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]]  # 20
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]] # 21 stage 3 (原22)
  - [-1, 1, DWConv, [1024, 3, 2, 1, False]] # 22
  - [-1, 6, HGBlock, [384, 2048, 5, True, False]] # 23 stage 4 (原24)

#----------------- 融合阶段 (红外分支索引减 1) -----------------------
  - [[7, 17], 1, Concat, [1]]   # 24 P3/8 融合 (可见光 7 + 红外 17)
  - [[11, 21], 1, Concat, [1]]  # 25 P4/16 融合 (可见光 11 + 红外 21)
  - [[13, 23], 1, Concat, [1]]  # 26 P5/32 融合 (可见光 13 + 红外 23)

#----------------- Head 部分 (所有绝对引用的索引均自动校准) -----------------------
head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 27 input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 28
  - [-1, 1, Conv, [256, 1, 1]] # 29, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 30
  - [25, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 31 input_proj.1 (指向 P4 融合层 25)
  - [[-2, -1], 1, Concat, [1]] # 32
  - [-1, 3, RepC3, [256]] # 33, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]] # 34, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 35
  - [24, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 36 input_proj.0 (指向 P3 融合层 24)
  - [[-2, -1], 1, Concat, [1]] # 37
  - [-1, 3, RepC3, [256]] # X3 (38), fpn_blocks.1

  - [-1, 1, Conv, [256, 3, 2]] # 39, downsample_convs.0
  - [[-1, 34], 1, Concat, [1]] # 40 cat Y4 (指向层 34)
  - [-1, 3, RepC3, [256]] # F4 (41), pan_blocks.0

  - [-1, 1, Conv, [256, 3, 2]] # 42 downsample_convs.1
  - [[-1, 29], 1, Concat, [1]] # 43 cat Y5 (指向层 29)
  - [-1, 3, RepC3, [256]] # F5 (44), pan_blocks.1

  - [[38, 41, 44], 1, RTDETRDecoder, [nc]] # 45 Detect(P3, P4, P5) (输入分别指向 38, 41, 44)



# RT-DETR-l with Optimized Two-Stage Strategy
ch: 6
nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, IN, []]  # 0
  - [-1, 1, Multiin, [1]]  # 1: 可见光
  - [-2, 1, Multiin, [2]]  # 2: 红外

#----------------- 可见光分支 -----------------------
  - [1, 1, HGStem, [32, 48]] # 3
  - [-1, 6, HGBlock, [48, 128, 3]] # 4 stage 1
  - [-1, 1, DWConv, [128, 3, 2, 1, False]] # 5
  - [-1, 6, HGBlock, [96, 512, 3]] # 6 stage 2
  - [-1, 1, DWConv, [512, 3, 2, 1, False]] # 7
  - [-1, 6, HGBlock, [192, 1024, 5, True, False]] # 8
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]]  # 9
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]] # 10 stage 3
  - [-1, 1, DWConv, [1024, 3, 2, 1, False]] # 11
  - [-1, 6, HGBlock, [384, 2048, 5, True, False]] # 12 stage 4

#----------------- 红外分支: 仅在最前端加入 1 次 TSEM -----------------------
  - [2, 1, HGStem, [32, 48]] # 13
  - [ -1, 1, InfraredTSEM, [48]] # 14
  - [-1, 6, HGBlock, [48, 128, 3]] # 15 stage 1
  - [-1, 1, DWConv, [128, 3, 2, 1, False]] # 16
  - [-1, 6, HGBlock, [96, 512, 3]] # 17 stage 2
  - [-1, 1, DWConv, [512, 3, 2, 1, False]] # 18
  - [-1, 6, HGBlock, [192, 1024, 5, True, False]] # 19
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]]  # 20
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]] # 21 stage 3
  - [-1, 1, DWConv, [1024, 3, 2, 1, False]] # 22
  - [-1, 6, HGBlock, [384, 2048, 5, True, False]] # 23 stage 4

#----------------- 融合阶段 (无需重复增强) -----------------------
  - [[6, 17], 1, Concat, [1]]   # 24 P3/8 融合
  - [[10, 21], 1, Concat, [1]]  # 25 P4/16 融合
  - [[12, 23], 1, Concat, [1]]  # 26 P5/32 融合

#----------------- Head 部分 (严格保持原样) -----------------------
head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 27 input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 28
  - [-1, 1, Conv, [256, 1, 1]] # 29, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 30
  - [25, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 31 input_proj.1 (Cat P4)
  - [[-2, -1], 1, Concat, [1]] # 32
  - [-1, 3, RepC3, [256]] # 33, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]] # 34, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 35
  - [24, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 36 input_proj.0 (Cat P3)
  - [[-2, -1], 1, Concat, [1]] # 37 cat backbone P3
  - [-1, 3, RepC3, [256]] # X3 (38), fpn_blocks.1

  - [-1, 1, Conv, [256, 3, 2]] # 39, downsample_convs.0
  - [[-1, 34], 1, Concat, [1]] # 40 cat Y4
  - [-1, 3, RepC3, [256]] # F4 (41), pan_blocks.0

  - [-1, 1, Conv, [256, 3, 2]] # 42 downsample_convs.1
  - [[-1, 29], 1, Concat, [1]] # 43 cat Y5
  - [-1, 3, RepC3, [256]] # F5 (44), pan_blocks.1

  - [[38, 41, 44], 1, RTDETRDecoder, [nc]] # 45 Detect(P3, P4, P5)
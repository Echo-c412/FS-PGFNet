# RT-DETR-l with Optimized Two-Stage Strategy
ch: 6
nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, IN, []]  # 0
  - [-1, 1, Multiin, [1]]  # 1: 可见光
  - [-2, 1, Multiin, [2]]  # 2: 红外

#----------------- 可见光分支: 仅在最前端加入 1 次 VDIM -----------------------
  - [1, 1, HGStem, [32, 48]] # 3
  - [-1, 1, VisibleVDIM,[48]]
  - [-1, 6, HGBlock, [48, 128, 3]] # 5 stage 1
  - [-1, 1, DWConv, [128, 3, 2, 1, False]] # 6
  - [-1, 6, HGBlock, [96, 512, 3]] # 7 stage 2
  - [-1, 1, DWConv, [512, 3, 2, 1, False]] # 8
  - [-1, 6, HGBlock, [192, 1024, 5, True, False]] # 9
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]]  # 10
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]] # 11 stage 3
  - [-1, 1, DWConv, [1024, 3, 2, 1, False]] # 12
  - [-1, 6, HGBlock, [384, 2048, 5, True, False]] # 13 stage 4

#----------------- 红外分支: 仅在最前端加入 1 次 TSEM -----------------------
  - [2, 1, HGStem, [32, 48]] # 14
  - [ -1, 1,InfraredTSEM, [48]]
  - [-1, 6, HGBlock, [48, 128, 3]] # 16 stage 1
  - [-1, 1, DWConv, [128, 3, 2, 1, False]] # 17
  - [-1, 6, HGBlock, [96, 512, 3]] # 18 stage 2
  - [-1, 1, DWConv, [512, 3, 2, 1, False]] # 19
  - [-1, 6, HGBlock, [192, 1024, 5, True, False]] # 20
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]]  # 21
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]] # 22 stage 3
  - [-1, 1, DWConv, [1024, 3, 2, 1, False]] # 23
  - [-1, 6, HGBlock, [384, 2048, 5, True, False]] # 24 stage 4

#----------------- 融合阶段 (无需重复增强) -----------------------
  - [[7, 18], 1,Concat, [1]]   # 23 P3/8 融合 (C_out from 6/16 is 512)
  - [[11, 22], 1,Concat, [1]] # 24 P4/16 融合 (C_out from 10/20 is 1024)
  - [[13, 24], 1,Concat, [1]] # 25 P5/32 融合 (C_out from 12/22 is 2048)

#----------------- Head 部分 (严格保持原样) -----------------------
head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 26 input_proj.2
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [256, 1, 1]] # 28, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [26, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 30 input_proj.1
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]] # 32, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]] # 33, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [25, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 35 input_proj.0
  - [[-2, -1], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, RepC3, [256]] # X3 (37), fpn_blocks.1

  - [-1, 1, Conv, [256, 3, 2]] # 38, downsample_convs.0
  - [[-1, 35], 1, Concat, [1]] # cat Y4
  - [-1, 3, RepC3, [256]] # F4 (40), pan_blocks.0

  - [-1, 1, Conv, [256, 3, 2]] # 41 downsample_convs.1
  - [[-1, 30], 1, Concat, [1]] # cat Y5
  - [-1, 3, RepC3, [256]] # F5 (43), pan_blocks.1

  - [[39, 42, 45], 1, RTDETRDecoder, [nc]] # Detect(P3, P4, P5)